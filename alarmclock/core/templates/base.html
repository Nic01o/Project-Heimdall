<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Alarm Clock{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  {% set _colors = webui_accent_colors() %}
  <style>
    :root {
      --accent: {{ _colors.accent }};
      --accent-strong: {{ _colors.accent_strong }};
      --accent-soft-bg: color-mix(in srgb, {{ _colors.accent }} 16%, transparent);
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-content">
      <a href="/">Alarm Clock</a>
      <span class="tagline">Guten Morgen</span>
    </div>
    <a href="/settings" class="nav-settings">
      <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 15c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm0-8c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4zm0-12c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4z"/>
      </svg>
    </a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
