scheduler:
  timezone: 'Europe/Berlin'

persistence:
  path: 'data/state.json'

modules:

  webui:
    enabled: true
    class: 'alarmclock.modules.webui.webui:WebUIModule'

  button:
    enabled: true
    class: 'alarmclock.modules.button.button:ButtonModule'
    driver: 'mock'

  led:
    enabled: true
    class: 'alarmclock.modules.led.led:LEDModule'
    driver: 'mock'
    # Example: lock specific settings to a fixed value regardless of what's
    # saved in state - config always wins on every restart, and the field
    # shows up read-only in the settings UI.
    # override_enabled: true
    # overrides:
    pin: 22


  sound:
    enabled: false
    class: 'alarmclock.modules.sound.sound:SoundModule'
    driver: 'mock'

  lcd:
    enabled: false
    class: 'alarmclock.modules.lcd.lcd:LCDModule'
    driver: 'mock'

  dht11:
    enabled: false
    class: 'alarmclock.modules.dht11.dht11:DHT11Module'
    driver: 'mock'
